<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locker | Repair Viewer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Global Reset & Box Model Fix */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
        }
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv11', 'ss01';
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Glassmorphism Containers */
        .glass { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.08); 
            transition: border-color 0.2s ease;
        }
        .glass:focus-within { 
            border-color: rgba(59, 130, 246, 0.4); 
        }

        /* Modern Input Design - Prevents Jank and Overlap */
        input, textarea, select { 
            background: rgba(15, 23, 42, 0.8) !important; 
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
            padding: 0.75rem 1rem !important; /* Generous internal buffer */
            border-radius: 0.75rem;
            width: 100%;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem !important;
            line-height: 1.5 !important;
            letter-spacing: -0.01em;
            display: block;
        }

        textarea {
            resize: none;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        input:focus, textarea:focus, select:focus { 
            border-color: #3b82f6 !important; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        label { 
            color: #64748b; 
            font-size: 0.7rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 0.5rem; 
            display: block; 
        }

        /* Custom Scrollbar for Textareas */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto w-full flex-grow">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b border-slate-800 pb-8 gap-6">
            <div class="w-full md:w-auto">
                <label for="field-item">Item to be Repaired</label>
                <input type="text" id="field-item" class="text-3xl font-semibold text-blue-400 bg-transparent border-none p-0 w-full focus:ring-0 tracking-tight leading-tight">
                <div class="flex gap-3 mt-2 text-slate-500 text-sm font-medium">
                    <span>Report #<span id="display-report" class="text-slate-300"></span></span>
                    <span>&bull;</span>
                    <span>Date: <span id="display-date" class="text-slate-300"></span></span>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="flex flex-col items-start md:items-end w-full md:w-32">
                    <label>Status</label>
                    <select id="field-completed" class="py-2 text-xs font-bold uppercase tracking-wider">
                        <option value="No">Pending</option>
                        <option value="Yes">Completed</option>
                    </select>
                </div>
                <button onclick="saveToFileMaker()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3.5 rounded-xl font-bold transition-all shadow-xl shadow-blue-900/30 active:scale-95 whitespace-nowrap">
                    Save Changes
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <div class="lg:col-span-4 space-y-8">
                <section class="glass p-7 rounded-3xl">
                    <h2 class="text-[10px] font-bold text-blue-500 uppercase mb-6 tracking-[0.2em]">Hardware Inventory</h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label>Serial Number</label>
                            <input type="text" id="field-sn" class="font-mono text-blue-200" placeholder="Required">
                        </div>
                        <div>
                            <label>Machine Number</label>
                            <input type="text" id="field-machine" placeholder="Asset Tag">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label>Location</label>
                                <input type="text" id="field-location">
                            </div>
                            <div>
                                <label>Room #</label>
                                <input type="text" id="field-room">
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-8 space-y-8">
                <section class="glass p-8 rounded-3xl">
                    <div class="mb-8">
                        <label>Problem Classification</label>
                        <input type="text" id="field-problem-type" class="font-medium" placeholder="e.g., Power Issue, Display Failure">
                    </div>
                    
                    <div>
                        <label>Symptom Description</label>
                        <textarea id="field-description" rows="5" placeholder="Detailed notes from staff..."></textarea>
                    </div>
                </section>

                <section class="glass p-8 rounded-3xl border-l-4 border-emerald-500/30">
                    <label>Resolution Action</label>
                    <textarea id="field-fix" rows="5" placeholder="Document the steps taken to resolve the issue..."></textarea>
                </section>
            </div>
        </main>
    </div>

    <script>
        // 1. URL Parameter Extraction
        const params = new URLSearchParams(window.location.search);
        
        function getParam(name) {
            const value = params.get(name) || "";
            return decodeURIComponent(value); 
        }

        // 2. Data Population Logic
        document.getElementById('field-item').value = getParam('item');
        document.getElementById('display-report').innerText = getParam('report');
        document.getElementById('display-date').innerText = getParam('date');
        document.getElementById('field-sn').value = getParam('sn');
        document.getElementById('field-machine').value = getParam('machine');
        document.getElementById('field-location').value = getParam('location');
        document.getElementById('field-room').value = getParam('room');
        document.getElementById('field-problem-type').value = getParam('problem');
        document.getElementById('field-description').value = getParam('description');
        document.getElementById('field-completed').value = getParam('completed');
        // If your URL sends 'fix', populate it here:
        document.getElementById('field-fix').value = getParam('fix');

        // 3. FileMaker JavaScript Bridge
        function saveToFileMaker() {
            // Build JSON Data Object
            const payload = {
                reportNum: getParam('report'), 
                item: document.getElementById('field-item').value,
                sn: document.getElementById('field-sn').value,
                machine: document.getElementById('field-machine').value,
                location: document.getElementById('field-location').value,
                room: document.getElementById('field-room').value,
                problemType: document.getElementById('field-problem-type').value,
                description: document.getElementById('field-description').value,
                completed: document.getElementById('field-completed').value,
                fix: document.getElementById('field-fix').value
            };

            // Trigger FileMaker Script
            if (window.FileMaker) {
                FileMaker.PerformScript("Locker_Save_Web_Update", JSON.stringify(payload));
            } else {
                console.warn("FileMaker Bridge unavailable. Testing outside Web Viewer?");
                alert("Changes not saved: This page must be run inside a FileMaker Web Viewer.");
            }
        }
    </script>
</body>
</html>
