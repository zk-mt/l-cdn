<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-5xl mx-auto" id="content">
        <div class="flex justify-between items-start mb-8 border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-400 tracking-tight" id="view-item">Loading...</h1>
                <p class="text-slate-400 text-sm mt-1">
                    Report #<span id="view-report"></span> • <span id="view-date"></span>
                </p>
            </div>
            <div id="status-badge" class="px-4 py-1.5 rounded-lg text-xs font-bold uppercase border"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 text-sm">
            <div class="space-y-6">
                <div class="glass p-5 rounded-2xl">
                    <h2 class="text-[10px] font-bold tracking-widest text-blue-500 uppercase mb-4">Technical Details</h2>
                    <p class="mb-2"><span class="text-slate-500">SN:</span> <span id="view-sn" class="font-mono"></span></p>
                    <p class="mb-2"><span class="text-slate-500">Machine:</span> <span id="view-machine"></span></p>
                    <p class="mb-2"><span class="text-slate-500">Location:</span> <span id="view-location"></span></p>
                    <p><span class="text-slate-500">Room:</span> <span id="view-room"></span></p>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2" id="view-problem-type">Issue</h3>
                    <p class="text-lg text-slate-100 leading-relaxed" id="view-description"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Extract and Decode URL Parameters
        const params = new URLSearchParams(window.location.search);
        
        function getParam(name) {
            const value = params.get(name) || "";
            return decodeURIComponent(value); // This fixes the %20 and %2F issues
        }

        // Map Data to UI
        document.getElementById('view-item').innerText = getParam('item');
        document.getElementById('view-report').innerText = getParam('report');
        document.getElementById('view-date').innerText = getParam('date');
        document.getElementById('view-sn').innerText = getParam('sn');
        document.getElementById('view-machine').innerText = getParam('machine');
        document.getElementById('view-location').innerText = getParam('location');
        document.getElementById('view-room').innerText = getParam('room');
        document.getElementById('view-problem-type').innerText = "ISSUE: " + getParam('problem');
        document.getElementById('view-description').innerText = getParam('description');

        // Handle Status Badge
        const completed = getParam('completed');
        const badge = document.getElementById('status-badge');
        if (completed.toLowerCase() === 'yes') {
            badge.innerText = 'COMPLETED';
            badge.className += ' bg-green-500/10 text-green-400 border-green-500/50';
        } else {
            badge.innerText = 'PENDING';
            badge.className += ' bg-amber-500/10 text-amber-400 border-amber-500/50';
        }
    </script>
</body>
</html>
