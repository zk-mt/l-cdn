<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locker Pro | Tech Inventory</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root { font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0; 
            padding: 0;
            min-height: 100vh;
        }

        /* Glassmorphism Main Panels */
        .glass-panel { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(148, 163, 184, 0.1); 
            border-radius: 1.25rem;
            padding: 1.75rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Nested Glass Panels */
        .glass-sub-panel { 
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: 1rem;
            padding: 1.25rem;
        }

        .input-group { margin-bottom: 1.25rem; }

        /* Modern Input Design - Editable State */
        input:not(:read-only), textarea:not(:read-only), select:not(:read-only) { 
            background: rgba(15, 23, 42, 0.8) !important; 
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
            padding: 0.65rem 0.9rem !important;
            border-radius: 0.5rem;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
            font-size: 0.9rem !important;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.1);
        }

        input:not(:read-only):focus, textarea:not(:read-only):focus { 
            border-color: #3b82f6 !important; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Read-Only State */
        input:read-only, textarea:read-only {
            background: transparent !important;
            border: 1px solid transparent !important;
            color: #e2e8f0 !important;
            padding: 0 !important;
            width: 100%;
            outline: none;
            cursor: default;
            font-size: 0.9rem !important;
        }

        textarea:read-only { resize: none; }

        /* Label styling */
        label { 
            color: #94a3b8; 
            font-size: 0.65rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 0.45rem; 
            display: block; 
        }

        .list-label {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            width: 140px;
            display: inline-block;
            flex-shrink: 0;
        }

        .list-row {
            display: flex;
            align-items: baseline;
            min-height: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .pane-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #60a5fa;
            margin-bottom: 1.25rem;
        }

        /* Management Icon Buttons */
        .management-btn {
            width: 40px; height: 40px;
            border-radius: 0.5rem;
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .management-btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: white; }

        /* Timeline for Device History */
        .history-timeline { border-left: 2px dashed rgba(51, 65, 85, 0.8); padding-left: 1.5rem; margin-top: 0.5rem; position: relative; }
        .timeline-dot { position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px rgba(59,130,246,0.5); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="py-8">
    <div class="max-w-6xl mx-auto w-full px-6 lg:px-12 flex flex-col min-h-[90vh]">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6 border-b border-slate-800 pb-6 sticky top-0 bg-[#0f172a]/95 backdrop-blur-md z-50">
            
            <div class="hidden lg:block w-48 shrink-0">
                <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    Locker Pro
                </h1>
            </div>

            <div class="flex-grow w-full max-w-2xl relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-500 group-focus-within:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" class="block w-full pl-12 pr-20 py-3 border border-slate-700 rounded-xl leading-5 bg-slate-800/40 text-slate-200 placeholder-slate-500 focus:outline-none focus:bg-slate-800 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-all shadow-inner" placeholder="Search FileMaker by Device Name or Asset Tag..." onkeypress="if(event.key === 'Enter') performSearch()">
                <button onclick="performSearch()" class="absolute inset-y-1.5 right-1.5 px-4 bg-slate-700 hover:bg-blue-600 text-slate-300 hover:text-white text-xs font-bold uppercase tracking-wider rounded-lg transition-colors">
                    Search
                </button>
            </div>
            
            <div class="flex items-center justify-end gap-3 w-full md:w-auto lg:w-48 shrink-0">
                <button id="saveBtn" onclick="saveInventory()" style="display: none;" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg font-semibold text-sm transition-all shadow-lg shadow-blue-900/40 whitespace-nowrap">
                    Save Updates
                </button>
                
                <button id="editToggleBtn" onclick="toggleEditMode()" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition-all border border-slate-600 group relative" title="Toggle Edit Mode">
                    <svg id="icon-edit" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    <svg id="icon-cancel" class="w-5 h-5 hidden text-red-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
            
            <div class="lg:col-span-5 glass-panel h-max">
                <div class="w-full flex justify-center mb-6 mt-2">
                    <svg class="w-48 h-auto text-slate-500 opacity-60 drop-shadow-2xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="12" rx="2" ry="2"></rect>
                        <line x1="2" y1="20" x2="22" y2="20"></line>
                        <path d="M9 20v1a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1"></path>
                    </svg>
                </div>
                
                <h2 class="pane-title">Device Information</h2>
                <div class="text-slate-100 text-sm">
                    <div class="list-row items-center border-b border-slate-700/50 pb-3 mb-3">
                        <span class="list-label !text-blue-400">Asset Tag:</span>
                        <input type="text" id="f1" readonly class="!text-blue-400 font-black text-xl tracking-tight">
                    </div>
                    
                    <div class="list-row"><span class="list-label">Device Name:</span><input type="text" id="f3" readonly></div>
                    <div class="list-row"><span class="list-label">OS Version:</span><input type="text" id="f15" readonly></div>
                    <div class="list-row"><span class="list-label">CPU:</span><input type="text" id="f10" readonly></div>
                    
                    <div class="list-row">
                        <span class="list-label">Memory:</span>
                        <div class="flex gap-2 w-full"><input type="text" id="f11" readonly class="w-16"><span class="text-slate-500">GB</span></div>
                    </div>
                    
                    <div class="list-row">
                        <span class="list-label">Storage:</span>
                        <div class="flex gap-2 w-full"><input type="text" id="f13" readonly class="w-16"><span class="text-slate-500">GB</span></div>
                    </div>
                    
                    <div class="list-row"><span class="list-label">Serial Number:</span><input type="text" id="f2" readonly></div>
                    <div class="list-row"><span class="list-label">Model:</span><input type="text" id="f7" readonly></div>
                    <div class="list-row"><span class="list-label">Type:</span><input type="text" id="f5" readonly></div>
                    <div class="list-row"><span class="list-label">Platform:</span><input type="text" id="f6" readonly></div>
                    
                    <div class="pt-4 mt-2 border-t border-slate-700/50 font-mono text-[11px]">
                        <div class="list-row"><span class="list-label">IP Address:</span><input type="text" id="f27" readonly class="!text-emerald-400"></div>
                        <div class="list-row"><span class="list-label">MAC (Wi-Fi):</span><input type="text" id="f28" readonly></div>
                        <div class="list-row"><span class="list-label">MAC (Ethernet):</span><input type="text" id="f29" readonly></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7 flex flex-col gap-6">
                
                <div class="glass-sub-panel flex flex-col sm:flex-row items-start sm:items-center gap-4 border-l-4 border-l-blue-500/50">
                    <div class="flex-grow w-full">
                        <label>Assigned Owner (f18)</label>
                        <input type="text" id="f18" readonly class="text-lg font-bold w-full" placeholder="Owner Name">
                        <div class="flex gap-4 mt-3">
                            <div class="flex-1"><label>Building (f16)</label><input type="text" id="f16" readonly placeholder="Building"></div>
                            <div class="flex-1"><label>Room (f17)</label><input type="text" id="f17" readonly placeholder="Room"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <section class="glass-sub-panel space-y-4">
                        <h2 class="pane-title mb-2">Lifecycle Details</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label>Vendor (f9)</label><input type="text" id="f9" readonly></div>
                            <div><label>Purchase Date (f21)</label><input type="text" id="f21" readonly></div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label>Cost (f19)</label><input type="text" id="f19" readonly></div>
                            <div><label>PO# (f20)</label><input type="text" id="f20" readonly></div>
                        </div>
                        <div><label>Warranty (f22)</label><input type="text" id="f22" readonly></div>
                    </section>

                    <section class="glass-sub-panel flex flex-col justify-center items-center text-center space-y-6">
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-4">Management Options</span>
                            <div class="flex justify-center gap-4">
                                <div class="management-btn text-blue-400" title="Future Action Decisions (f23)" onclick="alert('Decision required: f23.')">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </div>
                                <div class="management-btn" title="View Purchase Order (f20)" onclick="alert('Loading PO: f20.')">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <section class="glass-sub-panel flex-grow flex flex-col min-h-[300px]">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700/50 pb-4">
                        <h2 class="pane-title mb-0 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Device History
                        </h2>
                        <button class="bg-blue-500/20 hover:bg-blue-500 text-blue-400 hover:text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xl transition-colors shadow-sm" title="Add Technician Note or Repair Request" onclick="alert('Trigger script to add note.')">
                            +
                        </button>
                    </div>
                    
                    <div class="flex-grow space-y-6 overflow-y-auto pr-2">
                        <div class="history-timeline">
                            <div class="timeline-dot"></div>
                            <div class="flex justify-between items-end mb-2">
                                <label class="!mb-0 !text-blue-300">Latest Repair / Technician Action (f24)</label>
                                <span class="text-[10px] text-slate-500 font-mono tracking-wider">CURRENT</span>
                            </div>
                            <textarea id="f24" readonly rows="6" class="text-sm bg-slate-800/40 border border-slate-700/50 rounded-xl p-4 w-full" placeholder="No recent repair requests or technician actions logged."></textarea>
                        </div>
                    </div>
                </section>
                
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Populate all fields safely (even if removed from DOM)
        for(let i=1; i<=36; i++) {
            const fieldId = 'f' + i;
            const el = document.getElementById(fieldId);
            if(el) {
                el.value = decodeURIComponent(params.get(fieldId) || "");
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            if (window.FileMaker) {
                FileMaker.PerformScript("Locker_Inventory_Search", query);
            } else {
                console.log("Search query simulated: " + query);
                alert("FileMaker Bridge not found. Simulated search for: " + query);
            }
        }

        let isEditing = false;
        const permanentlyReadonly = ['f36']; 

        function toggleEditMode() {
            isEditing = !isEditing;
            
            const btn = document.getElementById('editToggleBtn');
            const saveBtn = document.getElementById('saveBtn');
            const iconEdit = document.getElementById('icon-edit');
            const iconCancel = document.getElementById('icon-cancel');

            if (isEditing) {
                iconEdit.style.display = 'none';
                iconCancel.style.display = 'block';
                btn.classList.add('border-red-500/50', 'bg-red-500/10');
                saveBtn.style.display = "block";
            } else {
                iconEdit.style.display = 'block';
                iconCancel.style.display = 'none';
                btn.classList.remove('border-red-500/50', 'bg-red-500/10');
                saveBtn.style.display = "none";
            }

            for(let i=1; i<=36; i++) {
                const fieldId = 'f' + i;
                if (permanentlyReadonly.includes(fieldId)) continue;
                
                const el = document.getElementById(fieldId);
                // We keep f1 visually locked as the primary identifier, but allow changes if strictly needed by removing el.id !== 'f1'
                if (el && el.id !== 'f1') {
                    el.readOnly = !isEditing;
                    
                    // Special visual handling for the history textarea to show it's editable
                    if(el.id === 'f24') {
                        if(isEditing) el.classList.remove('bg-slate-800/40', 'border-slate-700/50');
                        else el.classList.add('bg-slate-800/40', 'border-slate-700/50');
                    }
                }
            }
        }

        function saveInventory() {
            const payload = {};
            for(let i=1; i<=36; i++) {
                const fieldId = 'f' + i;
                const el = document.getElementById(fieldId);
                if(el) payload[fieldId] = el.value;
            }

            if (window.FileMaker) {
                FileMaker.PerformScript("Locker_Inventory_Update", JSON.stringify(payload));
                toggleEditMode();
            } else {
                console.error("FileMaker Bridge not found.");
                alert("Cannot save: Not run inside FileMaker Web Viewer.");
            }
        }
    </script>
</body>
</html>
