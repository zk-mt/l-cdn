<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Locker Pro | Tech Inventory</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root { font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top right, #111827, #030712);
            color: #f8fafc; 
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Fixed-Width Sidebar vs Fluid Main to stop the 'jank' stretch */
        .glass-panel { 
            background: rgba(17, 24, 39, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 1.25rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .glass-sub-panel { 
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 1.25rem;
        }

        /* Input styling: Sharp and consistent */
        input, textarea, select { 
            background: #030712 !important; 
            border: 1px solid #1f2937 !important;
            color: #f1f5f9 !important;
            padding: 0.6rem 0.8rem !important;
            border-radius: 0.5rem;
            width: 100%;
            outline: none;
            font-size: 0.85rem !important;
            transition: all 0.2s ease;
        }

        input:focus { border-color: #3b82f6 !important; ring: 2px #3b82f6; }

        label { 
            color: #4b5563; 
            font-size: 0.6rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            margin-bottom: 0.35rem; 
            display: block; 
        }

        .pane-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #3b82f6;
            margin-bottom: 1.25rem;
        }

        .management-btn {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-[1600px] mx-auto">
        
        <header class="flex justify-between items-center mb-10 pb-6 border-b border-gray-800">
            <div>
                <label>Asset Identity</label>
                <input type="text" id="f1" class="text-3xl font-bold text-blue-400 bg-transparent border-none p-0 w-full focus:ring-0" placeholder="f1">
                <p class="text-gray-500 text-xs mt-1 font-semibold uppercase tracking-widest">
                    <span id="display-model">Model</span> &bull; <span id="display-serial">Serial</span>
                </p>
            </div>
            <button onclick="saveInventory()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-xl font-bold shadow-lg shadow-blue-900/40">
                Save Asset Update
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-3 glass-panel p-6">
                <div class="flex justify-center py-6 mb-4">
                    <svg class="w-32 h-32 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                </div>
                
                <h2 class="pane-title">Device Information</h2>
                <div class="space-y-4">
                    <div class="flex justify-between border-b border-gray-800/50 pb-2">
                        <span class="text-[10px] text-gray-500 font-bold uppercase">Asset Tag</span>
                        <input type="text" id="f1_dup" class="text-right border-none bg-transparent p-0 w-24 focus:ring-0 text-blue-300">
                    </div>
                    <div class="flex justify-between border-b border-gray-800/50 pb-2">
                        <span class="text-[10px] text-gray-500 font-bold uppercase">SN</span>
                        <input type="text" id="f2" class="text-right border-none bg-transparent p-0 w-32 focus:ring-0">
                    </div>
                    <div class="flex justify-between border-b border-gray-800/50 pb-2">
                        <span class="text-[10px] text-gray-500 font-bold uppercase">Platform</span>
                        <input type="text" id="f6" class="text-right border-none bg-transparent p-0 w-24 focus:ring-0">
                    </div>
                    <div class="flex justify-between border-b border-gray-800/50 pb-2">
                        <span class="text-[10px] text-gray-500 font-bold uppercase">RAM</span>
                        <div class="flex justify-end"><input type="text" id="f11" class="w-10 text-right bg-transparent border-none p-0"><input type="text" id="f12" class="w-8 text-gray-600 bg-transparent border-none p-0"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-8">
                <section class="glass-panel p-6">
                    <h2 class="pane-title">Owner & Assignment</h2>
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-full bg-blue-900/30 flex items-center justify-center text-blue-400 font-bold">U</div>
                        <div class="flex-grow">
                            <input type="text" id="f18" class="bg-transparent border-none p-0 font-bold text-lg w-full focus:ring-0" placeholder="f18">
                            <p class="text-[10px] text-gray-500 uppercase font-bold"><span id="f16_txt">Building</span> &bull; <span id="f17_txt">Room</span></p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>First Name (f33)</label><input type="text" id="f33"></div>
                        <div><label>Last Name (f34)</label><input type="text" id="f34"></div>
                    </div>
                </section>

                <section class="glass-panel p-6 flex-grow">
                    <h2 class="pane-title">Action Notes (f24)</h2>
                    <textarea id="f24" rows="6" class="bg-black/40 border-gray-800 rounded-lg p-3 text-xs w-full resize-none"></textarea>
                </section>
            </div>

            <div class="lg:col-span-4 space-y-8">
                <section class="glass-panel p-6">
                    <h2 class="pane-title">Management Options</h2>
                    <div class="flex gap-3">
                        <div class="management-btn text-blue-400">&#x2699;</div>
                        <div class="management-btn text-green-400">&#x2713;</div>
                        <div class="management-btn text-yellow-400">&#x26A0;</div>
                    </div>
                </section>

                <section class="glass-panel p-6">
                    <h2 class="pane-title">Lifecycle Details</h2>
                    <div class="space-y-4">
                        <div><label>Vendor (f9)</label><input type="text" id="f9"></div>
                        <div><label>Purchase Date (f21)</label><input type="text" id="f21"></div>
                        <div><label>PO Number (f20)</label><input type="text" id="f20"></div>
                        <div><label>Warranty (f22)</label><input type="text" id="f22"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Populate fields f1 - f36
        for(let i=1; i<=36; i++) {
            const val = decodeURIComponent(params.get('f' + i) || "");
            const el = document.getElementById('f' + i);
            if(el) el.value = val;
            
            // Sync specific display-only elements
            if(i === 1) { 
                const dup = document.getElementById('f1_dup');
                if(dup) dup.value = val;
            }
            if(i === 16) { document.getElementById('f16_txt').innerText = val || "Building"; }
            if(i === 17) { document.getElementById('f17_txt').innerText = val || "Room"; }
            if(i === 7) { document.getElementById('display-model').innerText = val || "Model"; }
            if(i === 2) { document.getElementById('display-serial').innerText = val || "Serial"; }
        }

        function saveInventory() {
            const payload = {};
            for(let i=1; i<=36; i++) {
                const el = document.getElementById('f' + i);
                if(el) payload['f' + i] = el.value;
            }
            if (window.FileMaker) {
                FileMaker.PerformScript("Locker_Inventory_Update", JSON.stringify(payload));
            } else {
                alert("FileMaker Bridge not found.");
            }
        }
    </script>
</body>
</html>
