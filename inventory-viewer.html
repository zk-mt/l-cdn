<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locker | Tech Inventory</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root { font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            -webkit-font-smoothing: antialiased;
            margin: 0; padding: 0;
            min-height: 100vh;
        }

        .card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 1.25rem;
            padding: 1.5rem;
        }

        .input-group { margin-bottom: 1.25rem; }

        input, textarea, select { 
            background: rgba(15, 23, 42, 0.8) !important; 
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
            padding: 0.7rem 0.9rem !important;
            border-radius: 0.6rem;
            width: 100%;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.875rem !important;
            line-height: 1.25;
        }

        input:focus, textarea:focus, select:focus { 
            border-color: #3b82f6 !important; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        label { 
            color: #64748b; 
            font-size: 0.65rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.075em; 
            margin-bottom: 0.4rem; 
            display: block; 
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #60a5fa;
        }

        .section-line { flex-grow: 1; height: 1px; background: #1e293b; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-8">
    <div class="max-w-[1600px] mx-auto">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6 border-b border-slate-800 pb-8">
            <div class="w-full md:w-auto">
                <label>Asset Identity</label>
                <input type="text" id="f1" class="text-4xl font-bold text-blue-400 bg-transparent border-none p-0 w-full focus:ring-0 tracking-tighter hover:text-blue-300 transition-colors">
                <p class="text-slate-500 text-sm mt-1 font-medium">
                    <span id="display-model">Model</span> &bull; <span id="display-serial">Serial</span>
                </p>
            </div>
            <button onclick="saveInventory()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-12 py-4 rounded-2xl font-bold text-lg transition-all shadow-xl shadow-blue-900/40 active:scale-95">
                Save Asset Update
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-8">
                
                <section class="card">
                    <div class="section-header">
                        <h2>Technical Specifications</h2>
                        <div class="section-line"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group"><label>Type</label><input type="text" id="f5"></div>
                            <div class="input-group"><label>Platform</label><input type="text" id="f6"></div>
                        </div>
                        <div class="input-group"><label>Model</label><input type="text" id="f7"></div>
                        <div class="input-group"><label>Manufacturer</label><input type="text" id="f8"></div>
                        <div class="input-group"><label>Processor (CPU)</label><input type="text" id="f10"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group"><label>RAM</label><div class="flex"><input type="text" id="f11" class="rounded-r-none"><input type="text" id="f12" class="w-16 rounded-l-none border-l-0 text-slate-500 text-center"></div></div>
                            <div class="input-group"><label>Storage</label><div class="flex"><input type="text" id="f13" class="rounded-r-none"><input type="text" id="f14" class="w-16 rounded-l-none border-l-0 text-slate-500 text-center"></div></div>
                        </div>
                        <div class="input-group"><label>Operating System</label><input type="text" id="f15"></div>
                    </div>
                </section>

                <section class="card border-l-4 border-blue-500/30">
                    <div class="section-header">
                        <h2>Network Configuration</h2>
                        <div class="section-line"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="input-group"><label>IP Address</label><input type="text" id="f27" class="font-mono text-blue-200"></div>
                        <div class="input-group"><label>Wi-Fi MAC</label><input type="text" id="f28" class="font-mono"></div>
                        <div class="input-group"><label>Ethernet MAC</label><input type="text" id="f29" class="font-mono"></div>
                        <div class="input-group"><label>Chrome Device ID</label><input type="text" id="f30" class="font-mono text-[10px]"></div>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-8 space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <section class="card">
                        <div class="section-header">
                            <h2>Assignment & Location</h2>
                            <div class="section-line"></div>
                        </div>
                        <div class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="input-group"><label>Building</label><input type="text" id="f16"></div>
                                <div class="input-group"><label>Room</label><input type="text" id="f17"></div>
                            </div>
                            <div class="input-group"><label>Current Owner</label><input type="text" id="f18"></div>
                            <div class="pt-4 mt-2 border-t border-slate-800">
                                <label class="text-blue-500/60 mb-4">Student Assignment</label>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="input-group"><label>First Name</label><input type="text" id="f33"></div>
                                    <div class="input-group"><label>Last Name</label><input type="text" id="f34"></div>
                                </div>
                                <div class="input-group"><label>Student ID</label><input type="text" id="f35"></div>
                            </div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="section-header">
                            <h2>Purchasing & Lifecycle</h2>
                            <div class="section-line"></div>
                        </div>
                        <div class="space-y-4">
                            <div class="input-group"><label>Vendor</label><input type="text" id="f9"></div>
                            <div class="input-group"><label>PO Number</label><input type="text" id="f20"></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="input-group"><label>Unit Cost</label><input type="text" id="f19"></div>
                                <div class="input-group"><label>Purchase Date</label><input type="text" id="f21"></div>
                            </div>
                            <div class="input-group"><label>Warranty</label><input type="text" id="f22"></div>
                            <div class="input-group">
                                <label>Future Action</label>
                                <select id="f23">
                                    <option value="">No Action</option>
                                    <option value="Replace">Replace</option>
                                    <option value="Repair">Repair</option>
                                    <option value="Surplus">Surplus</option>
                                </select>
                            </div>
                        </div>
                    </section>
                </div>

                <section class="card border-l-4 border-emerald-500/30">
                    <div class="section-header">
                        <h2>Administrative Notes & Tracking</h2>
                        <div class="section-line"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <div><label>Action Notes</label><textarea id="f24" rows="3"></textarea></div>
                            <div><label>Technical Notes (FMP)</label><textarea id="f26" rows="3"></textarea></div>
                        </div>
                        <div class="space-y-4">
                            <div><label>General Notes</label><textarea id="f25" rows="3"></textarea></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label>Skyward Status</label>
                                    <select id="f32">
                                        <option value="No">In Skyward</option>
                                        <option value="Yes">Not In Skyward</option>
                                    </select>
                                </div>
                                <div><label>Source</label><input type="text" id="f36" readonly class="opacity-40"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Initialize all 36 fields (f1 - f36)
        for(let i=1; i<=36; i++) {
            const fieldId = 'f' + i;
            const el = document.getElementById(fieldId);
            if(el) {
                el.value = decodeURIComponent(params.get('f' + i) || "");
            }
        }

        // Update read-only header displays
        document.getElementById('display-model').innerText = decodeURIComponent(params.get('f7') || "Unknown Model");
        document.getElementById('display-serial').innerText = decodeURIComponent(params.get('f2') || "No Serial");

        function saveInventory() {
            const payload = {};
            for(let i=1; i<=36; i++) {
                const fieldId = 'f' + i;
                const el = document.getElementById(fieldId);
                if(el) payload[fieldId] = el.value;
            }

            if (window.FileMaker) {
                FileMaker.PerformScript("Locker_Inventory_Update", JSON.stringify(payload));
            } else {
                alert("FileMaker Bridge not found. Run this inside the Web Viewer.");
            }
        }
    </script>
</body>
</html>
